name: recorder_macos
description: "macOS recorder implementation: ScreenCaptureKit capture, AVFoundation camera/microphone, VideoToolbox H.264, AAC, MP4."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.13.1
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  recorder_platform_interface:
    path: ../recorder_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: RecorderMacosPlugin
        dartPluginClass: RecorderMacos
