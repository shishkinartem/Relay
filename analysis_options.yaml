include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Public API surface of the shared packages is a contract; missing docs on it
    # is a review finding, not a build failure.
    public_member_api_docs: ignore
  exclude:
    - "**/*.g.dart"
    - "design/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
